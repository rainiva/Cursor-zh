name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  performance-baseline:
    runs-on: [self-hosted, Windows, cursor-zh-baseline]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run qualified performance verify
        shell: pwsh
        env:
          CURSOR_ZH_REQUIRE_PERFORMANCE_PROOF: '1'
          CURSOR_ZH_BASELINE_FINGERPRINT: ${{ secrets.CURSOR_ZH_BASELINE_FINGERPRINT }}
          CURSOR_ZH_BASELINE_INSTALL_DIR: ${{ secrets.CURSOR_ZH_BASELINE_INSTALL_DIR }}
        run: |
          if (-not $env:CURSOR_ZH_BASELINE_FINGERPRINT) {
            throw 'CURSOR_ZH_BASELINE_FINGERPRINT secret is required for release performance proof.'
          }
          if (-not $env:CURSOR_ZH_BASELINE_INSTALL_DIR) {
            throw 'CURSOR_ZH_BASELINE_INSTALL_DIR secret is required for release performance proof.'
          }
          node scripts/cursor-zh-tool.js verify --install-dir $env:CURSOR_ZH_BASELINE_INSTALL_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Join-Path 'state' 'reports' 'performance-evidence.json'
          if (-not (Test-Path $evidence)) {
            throw "Missing performance evidence artifact: $evidence"
          }

      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: state/reports/performance-evidence.json
          if-no-files-found: error

  release:
    needs: performance-baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suite
        shell: pwsh
        run: npm test

      - name: Build release archive
        id: package
        shell: pwsh
        run: .\scripts\package-release.ps1

      - name: Generate Chinese release notes
        id: notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          & .\scripts\generate-release-notes.ps1 -Version $version -OutputPath $notesPath | Out-Null
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          @"
          body<<RELEASE_NOTES_EOF
          $(Get-Content -Raw -Encoding utf8 $notesPath)
          RELEASE_NOTES_EOF
          "@ | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate Chinese release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          node scripts/tool/validate-release-notes-cli.js --file $notesPath --version $version

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset_path }}
          name: Cursor 中文增强包 v${{ steps.notes.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
